apiVersion: v1
kind: ConfigMap

metadata:
  name: springboot-banking-dashboard
  namespace: monitoring

  labels:
    grafana_dashboard: "1"

  annotations:
    grafana_folder: "Banking Operations"

data:
  springboot-micrometer.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "gnetId": 4701,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "title": "JVM Memory Usage",
          "type": "graph",
          "targets": [
            {
              "expr": "sum(jvm_memory_used_bytes{app=~\".*banking-platform\"})",
              "refId": "A"
            }
          ]
        },
        {
          "title": "HTTP Request Rate",
          "type": "graph",
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{app=~\".*banking-platform\"}[5m]))",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 26,
      "title": "Banking Core - Performance",
      "uid": "banking-performance-01"
    }