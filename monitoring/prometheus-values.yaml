# 👉 It makes your monitoring stack production-ready by adding:

# persistent storage
# resource limits
# data retention policies
# This configuration gives you:

# ✔ Persistent Prometheus metrics storage
# ✔ 15-day monitoring history retention
# ✔ Stable memory allocation for Prometheus
# ✔ Grafana dashboards persistence
# ✔ Alertmanager state persistence
# ✔ AWS gp3-backed monitoring storage

prometheus:
  prometheusSpec:
    retention: 15d
    resources:
      requests:
        memory: 2Gi
      limits:
        memory: 4Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
grafana:
  persistence:
    enabled: true
    size: 10Gi
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          resources:
            requests:
              storage: 5Gi
