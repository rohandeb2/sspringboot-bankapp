# 🚀 FINAL RESULT

# ✔ Automatic HTTPS for your banking APIs
# ✔ No manual SSL management
# ✔ Trusted public certificates (Let’s Encrypt)
# ✔ Works with Istio ingress gateway
# ✔ Auto-renewal before expiry

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: your-email@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
    - http01:
        ingress:
          ingressClassName: istio   # ← changed from class: istio
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: banking-tls-cert
  namespace: istio-system
spec:
  secretName: banking-tls-cert
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - "api.rohandevops.co.in"
  - "rohandevops.co.in"