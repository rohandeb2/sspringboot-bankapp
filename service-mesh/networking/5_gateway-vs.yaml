apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: banking-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "api.rohandevops.co.in"
    - "rohandevops.co.in"
    tls:
      httpsRedirect: false   # keep false until TLS cert is ready
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - "api.rohandevops.co.in"
    - "rohandevops.co.in"
    tls:
      mode: SIMPLE
      credentialName: banking-tls-cert   # cert-manager will create this secret
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: banking-vs
  namespace: banking-prod
spec:
  hosts:
  - "api.rohandevops.co.in"
  - "rohandevops.co.in"
  gateways:
  - istio-system/banking-gateway
  http:
  - route:
    - destination:
        host: bankapp-banking-platform-active.banking-prod.svc.cluster.local
        port:
          number: 80