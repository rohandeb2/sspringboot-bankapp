apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: banking-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"        # ← wildcard catches ALL hosts including acme challenge
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - "api.rohandevops.co.in"
    - "rohandevops.co.in"
    tls:
      mode: SIMPLE
      credentialName: banking-tls-cert
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: acme-challenge-api
  namespace: istio-system
spec:
  hosts:
  - "api.rohandevops.co.in"
  gateways:
  - istio-system/banking-gateway
  http:
  - match:
    - uri:
        prefix: "/.well-known/acme-challenge/"
    route:
    - destination:
        host: cm-acme-http-solver-tbchx.istio-system.svc.cluster.local
        port:
          number: 8089
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: acme-challenge-root
  namespace: istio-system
spec:
  hosts:
  - "rohandevops.co.in"
  gateways:
  - istio-system/banking-gateway
  http:
  - match:
    - uri:
        prefix: "/.well-known/acme-challenge/"
    route:
    - destination:
        host: cm-acme-http-solver-6cp2r.istio-system.svc.cluster.local
        port:
          number: 8089
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: banking-vs
  namespace: banking-prod
spec:
  hosts:
  - "api.rohandevops.co.in"
  - "rohandevops.co.in"
  gateways:
  - istio-system/banking-gateway
  http:
  - route:
    - destination:
        host: bankapp-banking-platform-active.banking-prod.svc.cluster.local
        port:
          number: 80  
    