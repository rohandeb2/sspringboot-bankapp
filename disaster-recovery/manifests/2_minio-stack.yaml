# It tells Kubernetes: Install and configure MinIO as an internal object storage system to store backups (like AWS S3).
# This setup provides:

# ✔ Internal S3-compatible storage (MinIO)
# ✔ Dedicated bucket for Velero backups
# ✔ Persistent 50Gi storage backend
# ✔ Secure non-root container execution
# ✔ GitOps-managed infrastructure via ArgoCD
# ✔ Cluster-local backup storage system

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: minio
    targetRevision: 14.6.16
    helm:
      values: |
        image:
          registry: 959589242185.dkr.ecr.us-east-1.amazonaws.com
          repository: minio
          tag: latest
          pullPolicy: IfNotPresent
        command:
          - minio
          - server
          - /bitnami/minio/data
          - --console-address
          - :9001
        auth:
          rootUser: "rohan-admin"
          rootPassword: "secure-storage-pass"
        persistence:
          enabled: true
          size: 50Gi
        service:
          type: ClusterIP
        defaultBuckets: "velero-backups"
        podSecurityContext:
          enabled: true
          runAsNonRoot: true
          runAsUser: 1001
          fsGroup: 1001
        containerSecurityContext:
          enabled: true
          runAsNonRoot: true
          runAsUser: 1001
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    syncOptions:
      - CreateNamespace=true