# It tells Kubernetes: Velero namespace cannot exceed these CPU and memory limits.
# This ResourceQuota ensures:

# ✔ Velero runs in a controlled resource boundary
# ✔ Prevents backup jobs from overloading cluster
# ✔ Enforces CPU + memory fairness
# ✔ Protects production workloads from backup spikes

# 🛡️ Why this is important (Velero context)

# Velero handles:

# Backup of PVs (EBS volumes)
# Snapshot operations
# Cluster-wide API calls

# Without quotas:
# ❌ It could consume too many resources during backup jobs
# ❌ Impact production workloads
# ❌ Cause node pressure or eviction

# With quotas:
# ✔ Predictable resource usage
# ✔ Safer backup operations
# ✔ Stable cluster performance

apiVersion: v1
kind: ResourceQuota
metadata:
  name: velero-resource-quota
  namespace: velero
spec:
  hard:
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"