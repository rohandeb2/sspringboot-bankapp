
# This NodePool enables:

# ✔ Auto scaling EC2 nodes for pods
# ✔ Mix of spot + on-demand cost optimization
# ✔ Controlled instance families (t/m/c)
# ✔ Automatic cleanup of idle nodes
# ✔ Tight integration with EC2NodeClass
# ✔ Fully dynamic, cloud-native cluster scaling

apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      expireAfter: 720h
      requirements:
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["spot", "on-demand"]
        - key: "karpenter.k8s.aws/instance-category"
          operator: In
          values: ["t", "m", "c"]
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
