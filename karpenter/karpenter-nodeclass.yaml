apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  amiFamily: AL2023
  role: "bankapp-prod-karpenter-node-role"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: bankapp-prod
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: bankapp-prod
  tags:
    Name: karpenter-node
    Project: Banking-System
