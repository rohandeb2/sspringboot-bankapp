apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: public.ecr.aws/karpenter      
    chart: karpenter
    targetRevision: 1.3.3                  
    helm:
      values: |
        serviceAccount:
          create: true
          name: karpenter                  # was: karpenter-sa — Helm chart creates SA named "karpenter"
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::959589242185:role/bankapp-karpenter-controller-irsa
        settings:
          clusterName: bankapp-prod-eks
          featureGates:
            drift: true
        controller:
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true