name: "Terraform Production Deployment"

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**' # Only run if infra code changes
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'

permissions:
  id-token: write # Required for OIDC
  contents: read  # Required to checkout code
  pull-requests: write # Required to post plan comments on PRs

jobs:
  terraform:
    name: "Terraform Action"
    runs-on: ubuntu-latest
    env:
      # Use the directory where your prod main.tf lives
      TF_WORKING_DIR: "./infrastructure/prod"
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -no-color -input=false -var-file="terraform.tfvars"
        continue-on-error: true

      # This step helps during code review by posting the plan result back to the PR
      - name: Update Pull Request
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Plan 📖 \`${{ steps.plan.outcome }}\`
            <details><summary>Show Plan</summary>
            \`\`\`\n
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve -input=false -var-file="terraform.tfvars"