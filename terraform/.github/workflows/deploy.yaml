# once run all terraform via command and then correct the code to match the terraform code and then run the terraform apply command


name: "Terraform Production Deployment"

on:
  push:
    branches: [main]
    paths: ['terraform/**']
  pull_request:
    branches: [main]
    paths: ['terraform/**']

permissions:
  id-token: write      # Required for OIDC AWS authentication
  contents: read       # Required to checkout code
  pull-requests: write # Required to post plan comments on PRs

jobs:
  terraform:
    name: "Terraform Action"
    runs-on: ubuntu-latest
    env:
      TF_WORKING_DIR: "./infrastructure/prod"
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. TFLINT (Linting for logic and best practices) ---
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.0

      - name: Init TFLint
        run: tflint --init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Run TFLint
        run: tflint -f compact
        working-directory: ${{ env.TF_WORKING_DIR }}

      # --- 2. CHECKOV (Static Analysis for Security) ---
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ env.TF_WORKING_DIR }}
          framework: terraform
          soft_fail: false # Blocks the build if security violations are found
          output_format: cli

      # --- 3. SETUP TERRAFORM ---
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check

      # --- 4. TERRAFORM PLAN (Runs on PRs and Pushes) ---
      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -no-color -input=false -var-file="terraform.tfvars"
        continue-on-error: true

      # --- 5. PR COMMENTING (Visibility for Reviewers) ---
      - name: Update Pull Request
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌 \`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️ \`${{ steps.init.outcome }}\`
            #### Terraform Plan 📖 \`${{ steps.plan.outcome }}\`
            
            <details><summary>Show Plan</summary>
            
            \`\`\`hcl
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            
            </details>
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      # Fail the job if Plan failed (after the comment is posted)
      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # --- 6. TERRAFORM APPLY (Only on Merge/Push to Main) ---
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve -input=false -var-file="terraform.tfvars"