apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  namespace: monitoring
  labels:
    # The 'grafana_datasource' label tells the Sidecar to auto-import this
    grafana_datasource: "1"
spec:
  data:
    loki-ds.yaml: |-
      apiVersion: 1
      datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-stack.monitoring.svc.cluster.local:3100
        version: 1