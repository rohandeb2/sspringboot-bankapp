apiVersion: v1
kind: ConfigMap
metadata:
  name: springboot-banking-dashboard
  namespace: monitoring
  labels:
    # --- 12 LPA LOGIC: THE SIDECAR LABEL ---
    # This label tells the Grafana sidecar: "Pick me up and show me in the UI!"
    grafana_dashboard: "1"
spec:
  # The sidecar will put this in a folder called 'Banking' in Grafana
  annotations:
    grafana_folder: "Banking Operations"
data:
  # You can download the full 'JVM (Micrometer)' JSON from Grafana.com (ID: 4701)
  # Below is the header structure to link it.
  springboot-micrometer.json: |-
    {
      "annotations": { "list": [] },
      "editable": true,
      "gnetId": 4701,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "title": "JVM Memory Usage",
          "type": "graph",
          "targets": [{ "expr": "sum(jvm_memory_used_bytes{application=\"banking-core\"})", "refId": "A" }]
        },
        {
          "title": "HTTP Request Rate",
          "type": "graph",
          "targets": [{ "expr": "sum(rate(http_server_requests_seconds_count{application=\"banking-core\"}[5m]))", "refId": "A" }]
        }
      ],
      "schemaVersion": 26,
      "title": "Banking Core - Performance",
      "uid": "banking-performance-01"
    }