apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiali-server
  namespace: istio-system
spec:
  project: default
  source:
    repoURL: https://kiali.github.io/helm-charts
    chart: kiali-server
    targetRevision: 1.89.x # Use the latest stable for Istio 1.22
    helm:
      values: |
        auth:
          strategy: anonymous # For Lab; use 'openid' or 'ldap' for real Bank prod
        
        deployment:
          sidecar_container_config:
            # 12 LPA LOGIC: Resources for the dashboard itself
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi

        external_services:
          # Kiali needs to talk to your existing monitoring stack
          prometheus:
            url: "http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090"
          grafana:
            enabled: true
            url: "http://grafana.monitoring.svc.cluster.local"
          tracing:
            enabled: true
            url: "http://tempo-stack.monitoring.svc.cluster.local:3100"
        
        server:
          observability:
            tracing:
              enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true