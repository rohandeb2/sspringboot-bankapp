apiVersion: v1
kind: ServiceAccount
metadata:
  name: tempo-sa
  namespace: monitoring
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/instance: tempo-stack
    app.kubernetes.io/component: distributed-tracing
    env: production
  annotations:
    # --- 12 LPA LOGIC: IAM ROLE LINKAGE ---
    # This ARN is generated by your Terraform 'tempo_irsa' module.
    # It allows the Tempo pod to 'AssumeRole' specifically for S3 access.
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/prod-tempo-s3-role
    
    # Optional: Security hardening to ensure the token is only used by this SA
    eks.amazonaws.com/sts-regional-endpoints: "true"
    eks.amazonaws.com/token-expiration: "86400"