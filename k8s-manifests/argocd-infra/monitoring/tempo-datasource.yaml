apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-datasource
  namespace: monitoring
  labels:
    # 12 LPA LOGIC: The Sidecar looks for this label to auto-provision the source
    grafana_datasource: "1"
spec:
  data:
    tempo-ds.yaml: |-
      apiVersion: 1
      datasources:
      - name: Tempo
        type: tempo
        uid: tempo-prod-01
        url: http://tempo-stack.monitoring.svc.cluster.local:3100
        access: proxy
        isDefault: false
        jsonData:
          # --- 1. TRACE TO LOGS CORRELATION ---
          # Links a Trace ID directly to Loki logs with one click
          lokiSearch:
            datasourceUid: 'loki'
          
          # --- 2. TRACE TO METRICS CORRELATION ---
          # Links a Service in a trace to its Prometheus metrics
          serviceMap:
            datasourceUid: 'prometheus'
          
          # --- 3. ADVANCED VISUALIZATION ---
          # Generates a live map of how your microservices are talking
          nodeGraph:
            enabled: true
          
          # --- 4. SPAN BAR CUSTOMIZATION ---
          # Highlights the most important parts of a banking transaction
          tracesToLogsV2:
            datasourceUid: 'loki'
            spanStartTimeShift: '-1m'
            spanEndTimeShift: '1m'
            tags: ['job', 'instance', 'pod', 'namespace']
            filterByTraceId: true
            filterBySpanId: false