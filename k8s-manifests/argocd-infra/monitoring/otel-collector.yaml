apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.110.0
    helm:
      values: |
        mode: deployment
        config:
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
          
          exporters:
            # Send traces to Tempo
            otlp/tempo:
              endpoint: tempo-stack.monitoring.svc.cluster.local:4317
              tls:
                insecure: true
            
            # Send logs to Loki
            loki:
              endpoint: http://loki-stack.monitoring.svc.cluster.local:3100/loki/api/v1/push

          service:
            pipelines:
              traces:
                receivers: [otlp]
                exporters: [otlp/tempo]
              logs:
                receivers: [otlp]
                exporters: [loki]
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring