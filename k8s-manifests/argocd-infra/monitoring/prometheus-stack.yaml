apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 67.3.0   # Pin exact version
    chart: kube-prometheus-stack

    helm:
      values: |
        prometheus:
          prometheusSpec:
            retention: 15d

            resources:
              requests:
                memory: 2Gi
              limits:
                memory: 4Gi

            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp3
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi

        grafana:
          persistence:
            enabled: true
            size: 10Gi

          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - grafana.rohandevops.co.in

        alertmanager:
          config:
            global:
              resolve_timeout: 5m

            route:
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              group_by: ['alertname', 'priority']
              receiver: slack-default

              routes:
                - match:
                    severity: critical
                  receiver: slack-critical

                - match:
                    severity: warning
                  receiver: slack-warning

            receivers:
              - name: slack-critical
                slack_configs:
                  - api_url: "REPLACE_WITH_SECURE_SECRET"
                    channel: "#alerts-critical"

              - name: slack-warning
                slack_configs:
                  - api_url: "REPLACE_WITH_SECURE_SECRET"
                    channel: "#alerts-warning"

              - name: slack-default
                slack_configs:
                  - api_url: "REPLACE_WITH_SECURE_SECRET"
                    channel: "#alerts-banking"

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true