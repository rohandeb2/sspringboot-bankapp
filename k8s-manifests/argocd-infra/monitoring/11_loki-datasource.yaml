# This ConfigMap defines a Grafana datasource for Loki, allowing Grafana to query logs from the Loki stack deployed in the monitoring namespace.
# so loki can send logs to grafana for visualization

apiVersion: v1                         # Core Kubernetes API version for ConfigMap resources
kind: ConfigMap                         # Defines a ConfigMap resource (key-value store for configuration)
metadata:
  name: loki-datasource                  # Name of this ConfigMap
  namespace: monitoring                  # Namespace where Grafana is running / monitoring namespace
  labels:
    grafana_datasource: "1"             # due to this label, Grafana sidecar will auto-detect this ConfigMap and load it as a datasource configuration
data:
  loki-ds.yaml: |-                    # The actual datasource YAML for Grafana
    apiVersion: 1                      # Grafana datasource config version
    datasources:
    - name: Loki                       # Name of the datasource as seen in Grafana
      type: loki                       # Type of datasource (Loki log backend)
      access: proxy                     # Grafana will proxy requests to the Loki backend
      url: http://loki-stack.monitoring.svc.cluster.local:3100  # Loki service endpoint in Kubernetes
      version: 1                        # Version of the datasource format


# Promtail → pushes logs → Loki
# Grafana → queries logs → Loki HTTP API (via datasource in ConfigMap)
# grafana_datasource: "1" → automates the connection, no manual config needed.