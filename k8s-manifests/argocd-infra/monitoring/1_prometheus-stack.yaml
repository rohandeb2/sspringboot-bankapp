# This file is an ArgoCD Application that tells Argo CD:
# “Install the kube-prometheus-stack Helm chart and apply these custom configurations.”

apiVersion: argoproj.io/v1alpha1  # ArgoCD Application CRD API version
kind: Application  # Defines an ArgoCD application
metadata:
  name: kube-prometheus-stack  # Name of the ArgoCD app
  namespace: argocd  # ArgoCD control plane namespace
  finalizers:
    - resources-finalizer.argocd.argoproj.io  # Ensures resources are deleted when app is deleted

spec:
  project: default  # ArgoCD project (logical grouping of apps)

  source:
    repoURL: https://prometheus-community.github.io/helm-charts  # tell ArgoCD where to find the Helm chart (Prometheus community repo)
    targetRevision: 67.3.0   # Fixed chart version for stability
    chart: kube-prometheus-stack  # tell ArgoCD which chart to deploy (Prometheus stack with Grafana and Alertmanager)  

    helm:
      values: |
        prometheus:
          prometheusSpec:
            retention: 15d

            resources:
              requests:
                memory: 2Gi
              limits:
                memory: 4Gi

            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp3
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 20Gi

        grafana:
          persistence:
            enabled: true
            size: 10Gi

          ingress:
            enabled: true
            ingressClassName: alb
            hosts:
              - grafana.rohandevops.co.in

        alertmanager:
          config:
            global:
              resolve_timeout: 5m

            route:
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              group_by:
                - alertname
                - priority
              receiver: slack-default

              routes:
                - match:
                    severity: critical
                  receiver: slack-critical

                - match:
                    severity: warning
                  receiver: slack-warning

            receivers:
              - name: slack-critical
                slack_configs:
                  - api_url: "REPLACE_WITH_SECURE_SECRET"
                    channel: "#alerts-critical"

              - name: slack-warning
                slack_configs:
                  - api_url: "REPLACE_WITH_SECURE_SECRET"
                    channel: "#alerts-warning"

              - name: slack-default
                slack_configs:
                  - api_url: "REPLACE_WITH_SECURE_SECRET"
                    channel: "#alerts-banking"

  destination:
    server: https://kubernetes.default.svc  # Target Kubernetes cluster (in-cluster)
    namespace: monitoring  # Namespace where resources will be deployed

  syncPolicy:
    automated:
      prune: true  # Delete resources removed from Git
      selfHeal: true  # Auto-correct drift from desired state

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true  # Automatically create namespace if not exists