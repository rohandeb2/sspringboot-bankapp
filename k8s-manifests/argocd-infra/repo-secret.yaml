apiVersion: v1
kind: Secret
metadata:
  name: banking-repo-creds
  namespace: argocd
  labels:
    # --- 12 LPA LOGIC: ARGO AUTO-DISCOVERY ---
    # This label tells ArgoCD that this secret contains Git credentials
    argocd.argoproj.io/secret-type: repository
stringData:
  # 1. Type of connection
  type: git
  
  # 2. Project URL (Use your GitHub Org or specific Repo URL)
  # Using the Org URL allows this secret to work for all repos in that Org
  url: https://github.com/rohan/Springboot-BankApp.git
  
  # 3. Authentication (The "12 LPA" standard is using a PAT or SSH)
  # Note: In a real production setup, these would be encrypted via SealedSecrets or SOPS
  username: "rohandevops" 
  password: "ghp_your_personal_access_token_here" # GitHub Personal Access Token
  
  # 4. Security: Force HTTPS for Banking compliance
  enableLfs: "true"
  skipVerification: "false"