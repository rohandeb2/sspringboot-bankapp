apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: banking-repo-creds
  namespace: argocd
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore

  target:
    name: banking-repo-creds   # 👈 must match
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository # Label to identify this secret as a repository credential for Argo CD
      data: 
        type: git
        url: https://github.com/rohan/Springboot-BankApp.git
        enableLfs: "true" # Enable Git LFS support if your repo uses Git Large File Storage (LFS) for large files
        skipVerification: "false"

  data:
  - secretKey: username
    remoteRef:
      key: banking/github-creds
      property: username

  - secretKey: password
    remoteRef:
      key: banking/github-creds
      property: password