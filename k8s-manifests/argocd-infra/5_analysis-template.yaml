apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: banking-success-rate-check
  namespace: banking-prod
spec:
  args:
  - name: app-name
  metrics:
  - name: success-rate
    interval: 1m
    count: 5
    successCondition: len(result) > 0 && result[0] >= 0.995
    failureLimit: 2
    provider:
      prometheus:
        address: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        query: |
          sum(rate(http_requests_total{status!~"5.*", app="{{args.app-name}}"}[2m]))
          /
          sum(rate(http_requests_total{app="{{args.app-name}}"}[2m]))