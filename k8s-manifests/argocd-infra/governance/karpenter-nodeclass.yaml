apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2 # Amazon Linux 2 (Optimized for EKS)
  role: "bankapp-karpenter-node-role" # Must match Phase 1 Terraform Role
  
  # 12 LPA LOGIC: Automatic Discovery
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "bankapp" # Matches Phase 1 Subnet Tag
  
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "bankapp" # Matches Phase 1 SG Tag

  # Include metadata for cost tracking in AWS Console
  tags:
    Intent: "karpenter-managed-nodes"
    Project: "zero-downtime-platform"