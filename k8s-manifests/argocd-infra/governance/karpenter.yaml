apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.karpenter.sh
    chart: karpenter
    targetRevision: 0.37.x # Always pin your versions for production
    helm:
      values: |
        serviceAccount:
          create: true
          name: karpenter-sa
          annotations:
            # 12 LPA LOGIC: Link the K8s ServiceAccount to the AWS IAM Role
            eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/bankapp-karpenter-controller-irsa
        
        settings:
          clusterName: bankapp-eks
          interruptionQueue: bankapp-karpenter-interruption
          featureGates:
            drift: true
        
        # Ensure the controller runs on your existing "Management" nodes
        # so it doesn't try to manage itself
        controller:
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true