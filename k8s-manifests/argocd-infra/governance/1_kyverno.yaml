# this file deploys Kyverno, which is a policy engine for Kubernetes that allows you to enforce policies on your cluster resources. It is used for governance and security purposes, ensuring that your cluster adheres to best practices and compliance requirements. By deploying Kyverno through ArgoCD, you can manage your policies as code and ensure they are consistently applied across your cluster.

apiVersion: argoproj.io/v1alpha1  # ArgoCD Application API version
kind: Application  # Defines this as an ArgoCD Application
metadata:
  name: kyverno  # Name of the application (Kyverno policy engine)
  namespace: argocd  # Namespace where ArgoCD manages this Application
spec:
  project: default  # ArgoCD project controlling permissions and policies
  source:
    repoURL: https://kyverno.github.io/kyverno/  # Helm repository where Kyverno chart is available
    chart: kyverno  # Helm chart name for Kyverno (policy engine for Kubernetes)
    targetRevision: 3.2.x  # Version of Kyverno chart to deploy (keeps deployment stable)
  destination:
    server: https://kubernetes.default.svc  # Deploys to the in-cluster Kubernetes cluster
    namespace: kyverno  # Namespace where Kyverno components will be installed
  syncPolicy:
    automated:
      prune: true  # Removes resources if they are deleted from Git
      selfHeal: true  # Automatically fixes drift between cluster and Git
    syncOptions:
      - CreateNamespace=true  # Automatically creates the namespace if it does not exist