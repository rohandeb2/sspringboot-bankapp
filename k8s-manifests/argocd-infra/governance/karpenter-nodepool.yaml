apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      requirements:
        # 1- Cost Optimization: Use Spot for Dev/Test, On-Demand for Prod
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["spot", "on-demand"] 
        
        # 2- Instance Diversity: Prevents "Out of Stock" errors in AWS
        - key: "instance-category"
          operator: In
          values: ["t", "m", "c"]
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]

      nodeClassRef:
        name: default
  
  # --- 12 LPA LOGIC: CONSOLIDATION (The Money Saver) ---
  disruption:
    # If a node is 20% full, Karpenter kills it and moves pods 
    # to a smaller, cheaper node automatically.
    consolidationPolicy: WhenUnderutilized
    expireAfter: 720h # Replace nodes every 30 days to keep them "fresh"