# this file is created to define an ArgoCD Application that deploys Jenkins using a Helm chart.
# It tells ArgoCD: "Watch the folder k8s-manifests/cicd and make sure the cluster always looks exactly like that folder.

apiVersion: argoproj.io/v1alpha1  # ArgoCD CRD version for Application
kind: Application                  # Defines an ArgoCD Application (deployment unit)
metadata:
  name: jenkins-stack              # Name of this application in ArgoCD
  namespace: argocd                # ArgoCD namespace where this Application object lives
spec:
  project: default                 # ArgoCD project this app belongs to
  source:
    repoURL: 'https://github.com/rohandeb2/sspringboot-bankapp'
    path: 'k8s-manifests/cicd'  # Path within the repo where the Helm chart and values are located
    targetRevision: HEAD  # Use the latest commit on the default branch
    directory:
      include: '3_jenkins-all-manifests.yaml'  # Only include the Jenkins ArgoCD Application manifest
  destination:
    server: 'https://kubernetes.default.svc'  # Deploy to this Kubernetes cluster (in-cluster)
    namespace: jenkins                        # Namespace where Jenkins resources will be created
  syncPolicy:
    automated:                                # Enable automated sync
      prune: true                             # Delete resources that are no longer in Git
      selfHeal: true                          # Automatically revert changes made outside Git
    syncOptions:
      - CreateNamespace=true                  # Auto-create the target namespace if it doesn’t exist


# Using Jenkins in Kubernetes is increasingly common in modern CI/CD pipelines, and there are several solid reasons for it. Let me break it down clearly:

# 1️⃣ Scalability
# In Kubernetes, you can dynamically spin up Jenkins agent pods for each job.
# This means you can run hundreds of builds in parallel without worrying about managing individual servers.
# Once a job is done, the pod terminates automatically, saving resources.
# 2️⃣ High Availability (HA)
# Kubernetes can run multiple replicas of Jenkins master (with RWX storage) to avoid downtime.
# Pods can automatically restart if a node fails.
# Combined with persistent storage, your Jenkins setup becomes resilient to node failures.
# 3️⃣ Resource Efficiency
# Agents run as pods in Kubernetes, so you don’t need permanent VM servers for builds.
# Resources (CPU, memory) can be requested and limited per build, preventing a single job from hogging all resources.
# 4️⃣ Infrastructure as Code
# Deploying Jenkins via Helm charts in Kubernetes allows you to manage your CI/CD setup declaratively.
# JCasC (Jenkins Configuration as Code) + Kubernetes manifests + ArgoCD = fully automated Jenkins deployment.
# This makes your Jenkins setup reproducible, version-controlled, and auditable.
# 5️⃣ Cloud-Native Benefits
# Kubernetes allows Jenkins to run anywhere: AWS, GCP, Azure, or on-prem.
# Integration with cloud-native storage, secrets (K8s Secrets), and networking makes it secure and flexible.
# You can leverage native service discovery for microservices builds and deployments.
# 6️⃣ Isolation of Jobs
# Each Jenkins agent pod is ephemeral and isolated, which:
# Reduces dependency conflicts between jobs.
# Improves security, because a job can’t affect other jobs or the master.
# In Short

# Running Jenkins in Kubernetes allows you to have a scalable, resilient, cloud-native CI/CD system that’s fully automated, resource-efficient, and production-ready.

# It’s why industry-grade CI/CD pipelines almost always deploy Jenkins (or other CI tools) on K8s these days.