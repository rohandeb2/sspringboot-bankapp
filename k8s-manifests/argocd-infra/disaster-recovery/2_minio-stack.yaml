apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: minio
    targetRevision: 14.6.16
    helm:
      values: |
        image:
          registry: 959589242185.dkr.ecr.us-east-1.amazonaws.com
          repository: minio
          tag: latest
          pullPolicy: IfNotPresent
        auth:
          rootUser: "rohan-admin"
          rootPassword: "secure-storage-pass"
        persistence:
          enabled: true
          size: 50Gi
        service:
          type: ClusterIP
        defaultBuckets: "velero-backups"
        podSecurityContext:
          enabled: true
          runAsNonRoot: true
          runAsUser: 1001
          fsGroup: 1001
        containerSecurityContext:
          enabled: true
          runAsNonRoot: true
          runAsUser: 1001
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true