apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: aws-s3-backup-prod
  namespace: velero
  labels:
    component: disaster-recovery
    env: production
spec:
  provider: aws
  objectStorage:
    # --- 12 LPA LOGIC: UNIQUE BUCKET PER CLUSTER ---
    bucket: rohan-banking-backups-prod-us-east-1
    prefix: v1/banking-app-backups
  config:
    region: us-east-1
    # 1. Security: Use Server-Side Encryption (SSE-KMS)
    # This ensures that even if the S3 bucket is leaked, the data is unreadable.
    s3ForcePathStyle: "false"
    kmsKeyId: "arn:aws:kms:us-east-1:123456789012:key/your-custom-kms-key"
    
    # 2. Performance: Use S3 Standard-IA (Infrequent Access) for cost-saving
    # Backups are rarely read but must be available instantly.
    storageClass: STANDARD_IA

  # 3. Validation: Velero will check the health of this connection every 1 minute
  validationFrequency: 1m