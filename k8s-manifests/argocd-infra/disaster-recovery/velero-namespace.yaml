apiVersion: v1
kind: Namespace
metadata:
  name: velero
  labels:
    # 1. Security: Tells the Admission Controller to restrict permissions
    pod-security.kubernetes.io/enforce: privileged 
    # (Velero needs privileged access to take snapshots of EBS volumes)
    name: velero
    tier: infrastructure
    purpose: disaster-recovery
---
# --- 12 LPA LOGIC: RESOURCE QUOTAS ---
# This ensures Velero doesn't consume all Cluster CPU/RAM during a backup
apiVersion: v1
kind: ResourceQuota
metadata:
  name: velero-resource-quota
  namespace: velero
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: "512Mi"
    limits:
    cpu: "1000m"
    limits.memory: "1Gi"
---
# --- 12 LPA LOGIC: NETWORK ISOLATION ---
# Restrict who can talk to the Velero namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-velero-internal
  namespace: velero
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: argocd # Only ArgoCD should talk to Velero for syncing