apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: istio-system
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: 1.22.0
    helm:
      values: |
        global:
          # 12 LPA LOGIC: Essential for Banking Compliance
          meshID: mesh1
          multiCluster:
            clusterName: banking-prod-eks
        
        pilot:
          autoscaleEnabled: true
          autoscaleMin: 2
          autoscaleMax: 5
          # Resource requests are mandatory for production stability
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 1000m
              memory: 4Gi

        meshConfig:
          # Enable access logging for audit trails
          accessLogFile: /dev/stdout
          # Enable tracing integration (Already configured in your OTel step)
          enableTracing: true
          defaultConfig:
            tracing:
              sampling: 100
              max_path_tag_length: 256
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true