# Global settings
namespace: banking
environment: prod
team: fintech
ownerEmail: "prod-owner@company.com"

# Replica settings (HIGH AVAILABILITY)
replicaCount: 4

# Image configuration (NO latest in prod ❌)
image:
  repository: your-dockerhub/banking-app
  tag: "v1.0.0"   # MUST be versioned
  pullPolicy: IfNotPresent

# Service configuration
service:
  port: 80
  targetPort: 8080

# ConfigMap values
config:
  springProfile: prod
  logLevel: INFO
  dbHost: "prod-db.example.com"
  dbPort: "3306"
  dbName: "banking_prod"

# Secrets
secrets:
  awsSecretName: "banking-prod-db-secret"

# Service Account (IRSA REQUIRED in prod)
serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/banking-prod-irsa-role

# Network Policy
network:
  databaseCidr: "10.10.0.0/24"  # 🔒 tighter CIDR (not /16)

# HPA (AGGRESSIVE SCALING)
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPU: 60
  targetMemory: 75

# Resources (STRICT in prod)
resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1"
    memory: "2Gi"

# Service Monitor
serviceMonitor:
  enabled: true
  path: "/actuator/prometheus"
  interval: "15s"  # faster scraping in prod

# Ingress (ALB)
ingress:
  enabled: true
  host: "api.rohandevops.co.in"
  certificateArn: "arn:aws:acm:region:account:certificate/prod-cert-id"

# Istio
istio:
  host: "api.rohandevops.co.in"

# Observability
observability:
  otelCollectorEndpoint: "http://otel-collector.monitoring.svc.cluster.local:4317"

