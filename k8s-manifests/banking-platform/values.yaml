# Global settings
namespace: banking-prod
environment: dev
team: fintech
ownerEmail: "your-email@example.com"

# Replica settings
replicaCount: 2

# Image configuration
image:
  repository: your-dockerhub/banking-app
  tag: latest
  pullPolicy: IfNotPresent

# Service configuration
service:
  port: 80
  targetPort: 8080

# ConfigMap values
config:
  springProfile: dev
  logLevel: DEBUG
  dbHost: "dev-db.example.com"
  dbPort: "3306"
  dbName: "banking_dev"

# Secrets (External Secrets)
secrets:
  awsSecretName: "banking-dev-db-secret"

# Service Account
serviceAccount:
  create: true
  annotations: {}
  # Example for IRSA (optional)
  # eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/banking-irsa-role

# Network Policy
network:
  databaseCidr: "10.0.0.0/16"

# HPA
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPU: 70
  targetMemory: 80

# Resources (VERY IMPORTANT even in dev)
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"

# Service Monitor
serviceMonitor:
  enabled: true
  path: "/actuator/prometheus"
  interval: "30s"

# Ingress (ALB → Istio)
ingress:
  enabled: true
  host: "api.dev.rohandevops.co.in"
  certificateArn: "arn:aws:acm:region:account:certificate/dev-cert-id"

# Istio / Gateway
istio:
  host: "api.dev.rohandevops.co.in"

# Observability (optional future use)
observability:
  otelCollectorEndpoint: "http://otel-collector.monitoring.svc.cluster.local:4317"

