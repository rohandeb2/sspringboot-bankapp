apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "banking.fullname" . }}-default-deny
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "banking.labels" . | nindent 4 }}
spec:
  # 1. THE BRAVE MOVE: SELECT ALL PODS IN THIS NAMESPACE
  podSelector:
    matchLabels:
      app: {{ include "banking.fullname" . }}
  policyTypes:
    - Ingress
    - Egress
  
  # 2. INGRESS: Who can talk TO the banking app?
  ingress:
    # Allow traffic ONLY from the Load Balancer / Ingress Controller
    - from:
        - namespaceSelector:
            matchLabels:
              # Matches the namespace where your ALB/Nginx controller lives
              kubernetes.io/metadata.name: kube-system 
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: aws-load-balancer-controller
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort | default 8080 }}

  # 3. EGRESS: Who can the banking app talk TO?
  egress:
    # Allow traffic ONLY to DNS (CoreDNS) for service discovery
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow traffic ONLY to your RDS Database (using IP blocks or CIDR)
    - to:
        - ipBlock:
            cidr: {{ .Values.network.databaseCidr | default "10.0.0.0/16" }}
      ports:
        - protocol: TCP
          port: 3306 # MySQL port for your banking app  