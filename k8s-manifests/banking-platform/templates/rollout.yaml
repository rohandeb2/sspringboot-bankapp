apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "banking.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "banking.labels" . | nindent 4 }}
spec:
  # 1. High Availability Logic
  replicas: {{ .Values.replicaCount | default 2 }}
  selector:
    matchLabels:
      app: {{ include "banking.fullname" . }}
  
  # 2. BLUE-GREEN STRATEGY (Senior SRE Implementation)
  strategy:
    blueGreen: 
      activeService: {{ include "banking.fullname" . }}-active
      previewService: {{ include "banking.fullname" . }}-preview
      # Automated Promotion logic
      autoPromotionEnabled: false
      prePromotionAnalysis:
        templates:
          - templateName: banking-success-rate-check
      scaleDownDelaySeconds: 60

  # 3. Pod Template
  template:
    metadata:
      labels:
        app: {{ include "banking.fullname" . }}
    spec:
      serviceAccountName: {{ include "banking.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      containers:
        - name: banking-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort | default 8080 }}
              protocol: TCP
          
          # --- 12 LPA LOGIC: UNIFIED TELEMETRY CONFIG ---
          env:
            # Service Identification
            - name: OTEL_SERVICE_NAME
              value: "banking-core-service"
            
            # Connection to OTel Collector (gRPC)
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.monitoring.svc.cluster.local:4317"
            
            # Dynamic Metadata Enrichment
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=banking,env=prod,pod.name=$(K8S_POD_NAME)"
            
            # Exporter Selection
            - name: OTEL_METRICS_EXPORTER
              value: "none" # Prometheus handles metrics
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"

            # Downward API for Pod Name injection
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            # JVM Instrumentation Agent
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/app/opentelemetry-javaagent.jar"

          # Load existing DB and Config settings
          envFrom:
            - configMapRef:
                name: {{ include "banking.fullname" . }}-config
            - secretRef:
                name: {{ include "banking.fullname" . }}-db-secrets

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          
          # Triple-Probe Pattern for JVM Resilience
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 20"]