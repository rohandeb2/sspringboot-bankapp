apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vpa-selfsigned-issuer
  namespace: kube-system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vpa-ca
  namespace: kube-system
spec:
  isCA: true
  commonName: vpa-webhook-ca
  secretName: vpa-ca-secret
  duration: 87600h  
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: vpa-selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vpa-ca-issuer
  namespace: kube-system
spec:
  ca:
    secretName: vpa-ca-secret
