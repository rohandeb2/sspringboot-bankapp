# It generates a signed HTTPS certificate for the VPA webhook service:

# 🔐 Enables secure communication between Kubernetes API server and VPA webhook using your internal CA.

# 🚨 Why this is critical

# Without this:

# ❌ Kubernetes API cannot trust VPA webhook
# ❌ admission requests fail
# ❌ VPA stops working
# ❌ pod scaling/recommendation breaks


apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vpa-webhook-tls
  namespace: kube-system
spec:
  secretName: vpa-tls-certs
  duration: 8760h
  renewBefore: 720h
  commonName: vpa-webhook.kube-system.svc
  dnsNames:
    - vpa-webhook.kube-system.svc
    - vpa-webhook.kube-system.svc.cluster.local
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  issuerRef:
    name: vpa-ca-issuer
    kind: Issuer
    group: cert-manager.io
  # usages required for a TLS server cert
  usages:
    - server auth
    - digital signature
    - key encipherment
