apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vpa-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rohandeb2/sspringboot-bankapp
    targetRevision: HEAD
    path: vpa
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: vpa-webhook-config
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    # ADD THIS BLOCK - ignores the self-reference drift
    - group: argoproj.io
      kind: Application
      name: vpa-stack
      namespace: argocd
      jsonPointers:
        - /spec