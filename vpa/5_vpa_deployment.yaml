# This file turns Kubernetes into a self-tuning system where pods automatically get the right CPU and memory based on real usage patterns.
# 🔥 1. vpa-recommender
# ✔ What it does:
# Watches all pods in the cluster
# Collects CPU/memory usage history
# Calculates optimal resource recommendations
# ✔ Output:
# “This pod should use 300m CPU instead of 100m”
# “Increase memory from 256Mi → 512Mi”

# 👉 It does NOT change anything itself — it only recommends.

# 🔥 2. vpa-updater
# ✔ What it does:
# Applies recommendations from recommender
# Evicts pods if needed
# Triggers restart so new resources take effect

# 👉 This is the enforcement engine

# 🔥 3. vpa-admission-controller
# ✔ What it does:
# Intercepts pod creation requests
# Injects recommended CPU/memory values at pod start
# Uses TLS-secured webhook (your cert-manager setup)
# Important flags:
# --register-webhook=false

# 👉 Means:

# Webhook is already registered manually (via your CRD config)
# Prevents duplicate registration
# 🔐 TLS SECURITY (VERY IMPORTANT)
# secretName: vpa-tls-certs

# This mounts:

# TLS certificate
# CA certificate
# Private key

# 👉 Ensures:

# Secure communication between API server and webhook
# No plain HTTP traffic
# 🔗 4. Service: vpa-webhook
# kind: Service
# ✔ What it does:
# Exposes admission controller internally
# Kubernetes API server calls this service
# Route: :8000

# 👉 This is the entry point for VPA mutation logic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpa-recommender
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vpa-recommender
  template:
    metadata:
      labels:
        app: vpa-recommender
    spec:
      serviceAccountName: vpa-recommender
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: recommender
          image: registry.k8s.io/autoscaling/vpa-recommender:1.6.0
          args: [--v=4, --stderrthreshold=info]
          resources:
            requests: {cpu: 50m, memory: 200Mi}
            limits: {cpu: 200m, memory: 500Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpa-updater
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vpa-updater
  template:
    metadata:
      labels:
        app: vpa-updater
    spec:
      serviceAccountName: vpa-updater
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: updater
          image: registry.k8s.io/autoscaling/vpa-updater:1.6.0
          args: [--v=4, --stderrthreshold=info]
          resources:
            requests: {cpu: 50m, memory: 200Mi}
            limits: {cpu: 200m, memory: 500Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpa-admission-controller
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vpa-admission-controller
  template:
    metadata:
      labels:
        app: vpa-admission-controller
    spec:
      serviceAccountName: vpa-admission-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: admission-controller
          image: registry.k8s.io/autoscaling/vpa-admission-controller:1.6.0
          args:
            - --v=4
            - --stderrthreshold=info
            - --reload-cert
            - --register-webhook=false
            - --tls-cert-file=/etc/tls-certs/tls.crt
            - --tls-private-key=/etc/tls-certs/tls.key
            - --client-ca-file=/etc/tls-certs/ca.crt
          ports:
            - name: https
              containerPort: 8000
            - name: prometheus
              containerPort: 8944
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls-certs
              readOnly: true
          resources:
            requests: {cpu: 50m, memory: 200Mi}
            limits: {cpu: 200m, memory: 500Mi}
          livenessProbe:
            httpGet: {path: /health-check, port: prometheus}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health-check, port: prometheus}
            periodSeconds: 10
      volumes:
        - name: tls-certs
          # Simple secret mount — no remapping needed when using explicit flags
          secret:
            secretName: vpa-tls-certs
---
apiVersion: v1
kind: Service
metadata:
  name: vpa-webhook
  namespace: kube-system
spec:
  selector:
    app: vpa-admission-controller
  ports:
    - name: https
      port: 8000
      targetPort: https
