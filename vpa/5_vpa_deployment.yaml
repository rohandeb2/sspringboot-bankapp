apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpa-recommender
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vpa-recommender
  template:
    metadata:
      labels:
        app: vpa-recommender
    spec:
      serviceAccountName: vpa-recommender
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: recommender
          image: registry.k8s.io/autoscaling/vpa-recommender:1.6.0
          args: [--v=4, --stderrthreshold=info]
          resources:
            requests: {cpu: 50m, memory: 200Mi}
            limits: {cpu: 200m, memory: 500Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpa-updater
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vpa-updater
  template:
    metadata:
      labels:
        app: vpa-updater
    spec:
      serviceAccountName: vpa-updater
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: updater
          image: registry.k8s.io/autoscaling/vpa-updater:1.6.0
          args: [--v=4, --stderrthreshold=info]
          resources:
            requests: {cpu: 50m, memory: 200Mi}
            limits: {cpu: 200m, memory: 500Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpa-admission-controller
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vpa-admission-controller
  template:
    metadata:
      labels:
        app: vpa-admission-controller
    spec:
      serviceAccountName: vpa-admission-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: admission-controller
          image: registry.k8s.io/autoscaling/vpa-admission-controller:1.6.0
          args:
            - --v=4
            - --stderrthreshold=info
            - --reload-cert
            - --register-webhook=false
            - --tls-cert-file=/etc/tls-certs/tls.crt
            - --tls-private-key=/etc/tls-certs/tls.key
            - --client-ca-file=/etc/tls-certs/ca.crt
          ports:
            - name: https
              containerPort: 8000
            - name: prometheus
              containerPort: 8944
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls-certs
              readOnly: true
          resources:
            requests: {cpu: 50m, memory: 200Mi}
            limits: {cpu: 200m, memory: 500Mi}
          livenessProbe:
            httpGet: {path: /health-check, port: prometheus}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health-check, port: prometheus}
            periodSeconds: 10
      volumes:
        - name: tls-certs
          secret:
            secretName: vpa-tls-certs
---
apiVersion: v1
kind: Service
metadata:
  name: vpa-webhook
  namespace: kube-system
spec:
  selector:
    app: vpa-admission-controller
  ports:
    - name: https
      port: 8000
      targetPort: https
