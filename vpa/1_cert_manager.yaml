# Install cert-manager in the cluster so I can automatically issue and renew TLS certificates for services like Ingress, APIs, and internal workloads.
# 🔐 What cert-manager enables in your system

# Once deployed, you can:

# 🔒 1. Auto-generate TLS certificates
# For Ingress (ALB / NGINX / Istio)
# For internal services
# 🔁 2. Auto-renew certificates
# No manual SSL rotation
# 🌐 3. Use Let's Encrypt / internal CA
# HTTP-01 or DNS-01 validation


apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.17.0
    helm:
      values: |
        crds:
          enabled: true
        global:
          leaderElection:
            namespace: cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true